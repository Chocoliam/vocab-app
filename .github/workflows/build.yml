name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build Setup
        run: |
          mkdir www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "考研背单词" "com.my.vocab" --web-dir=www
          npx cap add android
          npx cap sync
      - name: Add Internet Permission
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVocab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
